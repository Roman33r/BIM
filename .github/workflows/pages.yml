name: Publish workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate model and JavaScript
        run: |
          node --test
          node --check app.js
          node --check plan.js
          node --check scene.js
          node --check elements.js
          node --check project-store.js
          node --check furniture-plan.js
          node --check furniture-scene.js
          node --check transforms.js
          node --check snapping.js
          node --check editor-overlay.js
          node --check selection.js
          node --check annotations.js
          node --check wall-overlaps.js
          node --check materials.js
          node --check structures.js
          node --check measurements.js
          node --check spatial.js
          node --check construction-guides.js
          node --check pile-layout.js
          node --check grid.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css interaction.css app.js model.js plan.js scene.js icons.js elements.js project-store.js furniture-plan.js furniture-scene.js transforms.js snapping.js editor-overlay.js selection.js annotations.js wall-overlaps.js materials.js structures.js measurements.js spatial.js construction-guides.js pile-layout.js grid.js .nojekyll _site/
          cp -r assets vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
